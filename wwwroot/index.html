<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FriendlyPet</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

body{
    font-family: Arial, sans-serif;
    margin:0;
    background:#f5f5f5;
}

header{
    background:#4CAF50;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    width:90%;
    max-width:1200px;
    margin:auto;
    padding:20px;
}

#map{
    height:500px;
    border-radius:10px;
    margin-bottom:30px;
}

form{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:30px;
}

input,
textarea,
button{
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    background:#4CAF50;
    color:white;
    border:none;
    cursor:pointer;
}

button:hover{
    background:#43a047;
}

#lista{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:15px;
}

.local{
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.local h3{
    margin-top:0;
    color:#4CAF50;
}

.categoria{
    font-size:14px;
    color:#666;
}

</style>
</head>
<body>

<header>
    <h1>🐶 FriendlyPet</h1>
    <p>Locais Pet Friendly de Bauru</p>
</header>

<div class="container">

    <div id="map"></div>

    <h2>Cadastrar Local</h2>

    <form id="formLocal">

        <input
            type="text"
            id="nome"
            placeholder="Nome do local"
            required>

        <input
            type="text"
            id="endereco"
            placeholder="Endereço"
            required>

        <textarea
            id="descricao"
            placeholder="Descrição"></textarea>

        <input
            type="number"
            step="any"
            id="latitude"
            placeholder="Latitude"
            required>

        <input
            type="number"
            step="any"
            id="longitude"
            placeholder="Longitude"
            required>

        <button type="submit">
            Salvar Local
        </button>

    </form>

    <h2>Locais cadastrados</h2>

    <div id="lista"></div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const API_URL = "http://localhost:5063/api/Locais";

const map = L.map("map")
    .setView([-22.3145, -49.0587], 13);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution: "© OpenStreetMap"
    }
).addTo(map);

// CLICAR NO MAPA PARA PREENCHER LAT/LONG
let marcadorCadastro;

map.on("click", function(e){

    document.getElementById("latitude").value =
        e.latlng.lat;

    document.getElementById("longitude").value =
        e.latlng.lng;

    if(marcadorCadastro){
        map.removeLayer(marcadorCadastro);
    }

    marcadorCadastro = L.marker([
        e.latlng.lat,
        e.latlng.lng
    ]).addTo(map);
});

let markers = [];

async function carregarLocais(){

    markers.forEach(m => map.removeLayer(m));
    markers = [];

    const lista = document.getElementById("lista");
    lista.innerHTML = "";

    try{

        const response = await fetch(API_URL);

        const locais = await response.json();

        locais.forEach(local => {

            if(local.latitude && local.longitude){

                const marker = L.marker([
                    local.latitude,
                    local.longitude
                ])
                .addTo(map)
                .bindPopup(`
                    <b>${local.nome}</b><br>
                    ${local.endereco}<br>
                    ${local.categoria?.nome ?? ""}
                `);

                markers.push(marker);
            }

            lista.innerHTML += `
                <div class="local">

                    <h3>${local.nome}</h3>

                    <div class="categoria">
                        Categoria:
                        ${local.categoria?.nome ?? "Não informada"}
                    </div>

                    <p>${local.endereco}</p>

                    <p>${local.descricao ?? ""}</p>

                </div>
            `;
        });

    }
    catch(erro){

        console.error(erro);
        alert("Erro ao carregar locais.");
    }
}

document
.getElementById("formLocal")
.addEventListener("submit", async (e) => {

    e.preventDefault();

    const local = {

        nome: document.getElementById("nome").value,

        endereco: document.getElementById("endereco").value,

        categoriaId: 1,

        aceitaPet: true,

        descricao: document.getElementById("descricao").value,

        latitude: parseFloat(
            document.getElementById("latitude").value
        ),

        longitude: parseFloat(
            document.getElementById("longitude").value
        )
    };

    try{

        const response = await fetch(API_URL,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body: JSON.stringify(local)
        });

        if(response.ok){

            alert("Local cadastrado com sucesso!");

            document
                .getElementById("formLocal")
                .reset();

            carregarLocais();

        }else{

            const erro = await response.text();
            alert(erro);
        }

    }catch(ex){

        console.error(ex);
        alert("Erro ao salvar.");
    }
});

carregarLocais();

</script>

</body>
</html>
